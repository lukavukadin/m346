#cloud-config
users:
  - name: luka
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin
    home: /home/luka
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa 
disable_root: false
package_update: true  
packages:
  - apache2
  - php
write_files:
  - content: |
      <?php phpinfo(); ?>
    path: /var/www/html/info.php
    permissions: '0644'
write_files:
  - content: |
      <?php
      $ihrname = "Luka";
      ?>

      <html>
      <head>
        <title><?php echo $ihrname; ?></title>
      </head>
      <body>
        <h1>Willkommen auf der Webseite von <?php echo $ihrname; ?></h1>
        <br />
        <img src="https://luka-unique-s3-bucket.s3.amazonaws.com/croatia_sea.jpg" alt="Bild aus S3-Bucket">
      </body>
      </html>
    path: /var/www/html/index.php
    permissions: '0644'
runcmd:
  - sudo systemctl enable apache2
  - sudo systemctl start apache2
